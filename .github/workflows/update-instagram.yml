name: Instagram akışını güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instagram verisini çek
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python scripts/fetch_instagram.py

      - name: Değişiklik varsa kaydet
        run: |
          if git diff --quiet -- assets/instagram-feed.json; then
            echo "Yeni paylaşım yok."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/instagram-feed.json
          git commit -m "Instagram akışını otomatik güncelle"
          git push
